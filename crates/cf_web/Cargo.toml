[package]
name = "cf_web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cf_core = { path = "../cf_core" }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "Event", "EventTarget", "PointerEvent",
  "MouseEvent", "Navigator", "NodeList", "DomRect", "CssStyleDeclaration", "Storage",
  "DomTokenList", "ResizeObserver",
]
